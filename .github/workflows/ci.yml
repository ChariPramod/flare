name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Keep visual references on the Noble base used by Dockerfile.browser-tests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm openapi:check
      - run: pnpm test
      - run: pnpm test:evals
      - run: pnpm build
      - run: pnpm test:packages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Browser contract diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-contract-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 dir /repo --redact --config /repo/.gitleaks.toml
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/python/requirements.txt
      - run: python -m pip install -r tests/python/requirements.txt
      - run: ruff check tests/python
      - run: ruff format --check tests/python
      - run: python -m pytest
  staging-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate disposable staging Compose and Caddy configuration
        run: bash scripts/staging/check-config.sh
      - name: Validate private alert routing and firing/recovery rules
        run: bash scripts/staging/check-alerts.sh
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL, Redis, MinIO and Mailpit integration
        run: bash scripts/integration.sh
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Free unused toolchains on the disposable runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Pinned full-stack Compose acceptance and load recovery
        run: bash scripts/acceptance.sh
      - name: Live browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-diagnostics
          # Native session tokens must never be uploaded in network traces. MFA and
          # credential-bearing scenarios disable screenshots in their test suites.
          # Inbox JSON contains only bounded operation names, HTTP methods/statuses
          # and aggregate error counts, never URLs, bodies or credentials.
          path: |
            test-results/**/*.png
            test-results/**/inbox-operation-metadata.json
          retention-days: 7
          if-no-files-found: ignore
