name: flare
x-novu-env: &novu-env
  NODE_ENV: production
  MONGO_URL: mongodb://root:${NOVU_MONGO_PASSWORD:?Run make setup}@novu-mongodb:27017/novu?authSource=admin
  REDIS_HOST: novu-redis
  REDIS_PORT: 6379
  REDIS_DB_INDEX: 2
  REDIS_CACHE_SERVICE_HOST: novu-redis
  REDIS_CACHE_SERVICE_PORT: 6379
  JWT_SECRET: ${NOVU_JWT_SECRET:?Run make setup}
  STORE_ENCRYPTION_KEY: ${STORE_ENCRYPTION_KEY:?Run make setup}
  NOVU_SECRET_KEY: ${NOVU_SECRET_KEY:?Run make setup}
  NODE_EXTRA_CA_CERTS: /opt/flare/relay.crt
  API_ROOT_URL: http://novu-api:3000
  FRONT_BASE_URL: http://localhost:4200
  IS_SELF_HOSTED: 'true'
  IS_V2_ENABLED: 'true'
  MONGO_AUTO_CREATE_INDEXES: 'true'
  S3_LOCAL_STACK: http://minio:9000
  S3_BUCKET_NAME: novu
  S3_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-flare}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run make setup}
x-node-health: &node-health
  interval: 15s
  timeout: 5s
  retries: 6
  start_period: 30s
x-flare: &flare
  restart: unless-stopped
  env_file: .env
  init: true
  security_opt: ['no-new-privileges:true']
services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: flare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup}
      POSTGRES_DB: flare
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U flare -d flare']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4.7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    build: { context: ./ops/minio, target: server }
    image: flare-minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-flare}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Run make setup}
    volumes: [minio-data:/data]
    ports: ['127.0.0.1:9001:9001']
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 10
  minio-init:
    build: { context: ./ops/minio, target: client }
    image: flare-minio-mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-flare}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Run make setup}
    entrypoint:
      [
        '/bin/sh',
        '-ec',
        'mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"; mc mb --ignore-existing local/flare; mc mb --ignore-existing local/novu',
      ]
  postal-mariadb:
    image: mariadb:11.4.9
    environment:
      MARIADB_ROOT_PASSWORD: ${POSTAL_DB_PASSWORD:?Run make setup}
      MARIADB_DATABASE: postal
    volumes: [postal-data:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 10
  postal-init:
    image: ghcr.io/postalserver/postal:3.3.7
    command: postal initialize
    volumes: ['./ops/postal/config:/config:ro']
    depends_on:
      postal-mariadb: { condition: service_healthy }
  postal:
    image: ghcr.io/postalserver/postal:3.3.7
    command: postal web-server
    restart: unless-stopped
    volumes: ['./ops/postal/config:/config:ro']
    ports: ['127.0.0.1:5000:5000']
    depends_on:
      postal-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, ruby, -rsocket, -e, 'TCPSocket.new("127.0.0.1",5000).close']
      <<: *node-health
  postal-worker:
    image: ghcr.io/postalserver/postal:3.3.7
    command: postal worker
    restart: unless-stopped
    volumes: ['./ops/postal/config:/config:ro']
    depends_on:
      postal-init: { condition: service_completed_successfully }
  postal-smtp:
    image: ghcr.io/postalserver/postal:3.3.7
    command: postal smtp-server
    restart: unless-stopped
    volumes: ['./ops/postal/config:/config:ro']
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      postal-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, ruby, -rsocket, -e, 'TCPSocket.new("127.0.0.1",25).close']
      <<: *node-health
  novu-mongodb:
    image: mongo:8.0.17
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${NOVU_MONGO_PASSWORD:?Run make setup}
    volumes: [novu-mongo-data:/data/db]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'mongosh --quiet --username root --password "$${MONGO_INITDB_ROOT_PASSWORD}" --eval "db.adminCommand(\"ping\").ok"',
        ]
      interval: 10s
      timeout: 10s
      retries: 12
  novu-redis:
    image: redis:7.4.7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [novu-redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
  novu-api:
    volumes: ['./ops/certs/relay.crt:/opt/flare/relay.crt:ro']
    image: ghcr.io/novuhq/novu/api:3.19.0
    restart: unless-stopped
    environment:
      <<: *novu-env
      PORT: 3000
    depends_on:
      novu-mongodb: { condition: service_healthy }
      novu-redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://localhost:3000/v1/health-check']
      <<: *node-health
  novu-worker:
    volumes: ['./ops/certs/relay.crt:/opt/flare/relay.crt:ro']
    image: ghcr.io/novuhq/novu/worker:3.19.0
    restart: unless-stopped
    environment:
      <<: *novu-env
      PORT: 3004
    depends_on:
      novu-api: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://localhost:3004/v1/health-check']
      <<: *node-health
  novu-ws:
    volumes: ['./ops/certs/relay.crt:/opt/flare/relay.crt:ro']
    image: ghcr.io/novuhq/novu/ws:3.19.0
    restart: unless-stopped
    environment:
      <<: *novu-env
      PORT: 3002
    ports: ['127.0.0.1:3002:3002']
    depends_on:
      novu-api: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://localhost:3002/v1/health-check']
      <<: *node-health
  novu-dashboard:
    image: ghcr.io/novuhq/novu/dashboard:3.19.0
    environment:
      VITE_API_HOSTNAME: http://novu-api:3000
      VITE_WEBSOCKET_HOSTNAME: http://novu-ws:3002
    # Deliberately no host port. Expose through an authenticated admin tunnel when needed.
    depends_on:
      novu-api: { condition: service_healthy }
  flare-migrate:
    <<: *flare
    restart: 'no'
    build:
      context: .
      args: { SERVICE: api }
    command: [pnpm, --filter, '@flare/db', migrate]
    depends_on:
      postgres: { condition: service_healthy }
  flare-api:
    <<: *flare
    environment:
      OTEL_SERVICE_NAME: flare-api
    volumes: ['./ops/certs/postal-public.pem:/app/ops/certs/postal-public.pem:ro']
    build:
      context: .
      args: { SERVICE: api }
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      flare-migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://localhost:4000/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      <<: *node-health
  flare-worker:
    <<: *flare
    environment:
      OTEL_SERVICE_NAME: flare-worker
    build:
      context: .
      args: { SERVICE: worker }
    depends_on:
      flare-api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://localhost:4001/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      <<: *node-health
  flare-smtp-relay:
    <<: *flare
    environment:
      OTEL_SERVICE_NAME: flare-smtp-relay
    build:
      context: .
      args: { SERVICE: smtp-relay }
    volumes: ['./ops/certs:/app/ops/certs:ro']
    ports: ['127.0.0.1:2525:2525']
    depends_on:
      flare-api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://localhost:4002/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      <<: *node-health
  flare-web:
    <<: *flare
    build:
      context: .
      args: { SERVICE: web }
    environment:
      PORT: 3000
      FLARE_API_URL: http://flare-api:4000
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      flare-api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://localhost:3000").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      <<: *node-health
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ['127.0.0.1:8025:8025']
    healthcheck:
      test: [CMD, /mailpit, readyz]
      <<: *node-health
volumes:
  postgres-data:
  redis-data:
  minio-data:
  postal-data:
  novu-mongo-data:
  novu-redis-data:
