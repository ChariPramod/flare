# Private-network configuration only. Mount a deployment-specific metrics token.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/flare.rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: flare
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/flare_metrics_token
    static_configs:
      - targets: ['flare-api:4000', 'flare-worker:4001', 'flare-smtp-relay:4002']
