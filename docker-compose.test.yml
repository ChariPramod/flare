name: flare-test
services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      { POSTGRES_USER: flare_test, POSTGRES_PASSWORD: local-test-only, POSTGRES_DB: flare_test }
    ports: ['127.0.0.1:15432:5432']
    healthcheck:
      test: [CMD, pg_isready, -U, flare_test, -d, flare_test]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    ports: ['127.0.0.1:16379:6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
  minio:
    build: { context: ./ops/minio, target: server }
    image: flare-minio-integration:RELEASE.2025-10-15T17-29-55Z
    command: server /data
    environment: { MINIO_ROOT_USER: flare-test, MINIO_ROOT_PASSWORD: local-test-only }
    ports: ['127.0.0.1:19000:9000']
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 3s
      retries: 20
  minio-init:
    build: { context: ./ops/minio, target: client }
    image: flare-minio-mc-integration:RELEASE.2025-08-13T08-35-41Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint:
      [
        '/bin/sh',
        '-ec',
        'mc alias set local http://minio:9000 flare-test local-test-only; mc mb --ignore-existing local/flare-test',
      ]
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ['127.0.0.1:11025:1025', '127.0.0.1:18025:8025']
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 2s
      timeout: 3s
      retries: 20
